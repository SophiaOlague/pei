allowBuilds:
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.21'
  - '@expo/fingerprint@0.20.12'
  - '@expo/router-server@57.0.9'
  - babel-preset-expo@57.0.10
  - expo-asset@57.0.16
  - expo-constants@57.0.17
  - expo-font@57.0.3
  - expo-modules-core@57.0.15
  - expo-modules-jsi@57.0.7
  - expo@57.0.19
  - '@expo/metro-runtime@57.0.15'
  - '@expo/ui@57.0.15'
  - expo-build-properties@57.0.16
  - expo-image@57.0.4
  - expo-linking@57.0.9
  - expo-router@57.0.18
# React Native / Expo autolinking and native builds require a flat
# node_modules tree, so opt out of pnpm's default symlinked layout.
nodeLinker: hoisted
